<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00c853">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip 7">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Flip 7 Secret Scorekeeper</title>

<style>
:root{
--bg:#121212;
--card:#1e1e1e;
--accent:#00c853;
--text:#ffffff;
--danger:#ff5252;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:var(--bg);
color:var(--text);
}

.screen{
padding:20px;
max-width:700px;
margin:auto;
}

.card{
background:var(--card);
padding:16px;
border-radius:12px;
margin-bottom:15px;
}

h1,h2,h3{
text-align:center;
}

input{
width:100%;
padding:12px;
font-size:18px;
border:none;
border-radius:8px;
margin-top:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
font-size:18px;
border:none;
border-radius:10px;
margin-top:10px;
background:var(--accent);
color:white;
font-weight:bold;
}

button.secondary{
background:#555;
}

.player-row{
margin-bottom:12px;
}

.hidden{
display:none;
}

.round-banner{
text-align:center;
font-size:24px;
font-weight:bold;
padding:15px;
}

.rank1{
background:#2e7d32;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #333;
text-align:left;
}

canvas{
position:fixed;
pointer-events:none;
top:0;
left:0;
z-index:999;
}


button:disabled{
    opacity:0.6;
}
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div id="setupScreen" class="screen">
<h1>🎴 Flip 7 Secret Scorekeeper</h1>

<div class="card">
<h3>Players</h3>
<div id="playerSetup"></div>

<button onclick="addPlayer()">Add Player</button>
<button onclick="startGame()">Start Game</button>
</div>
</div>

<div id="gameScreen" class="screen hidden">
<div class="round-banner" id="roundLabel">
Game In Progress - Round 1
</div>

<div class="card">
<div id="scoreInputs"></div>


<button onclick="startVoice()">🎤 Voice Entry</button>
<button id="saveBtn"
        onclick="saveRound()">
    Save Round
</button>
</div>
</div>

<div id="finalScreen" class="screen hidden">
<h1>🏆 Game Complete!</h1>

<div id="winnerBox"></div>

<div class="card">
<h2>Final Rankings</h2>
<div id="leaderboard"></div>
</div>

<div class="card">
<h2>Round History</h2>
<div id="history"></div>
</div>

<button onclick="newGame()">New Game</button>
</div>

<script>

let game={
players:[],
totals:{},
rounds:[]
};

let currentRound=1;

function addPlayer(name=''){
const wrap=document.getElementById('playerSetup');

const input=document.createElement('input');
input.placeholder='Player Name';
input.value=name;

wrap.appendChild(input);
}

for(let i=0;i<3;i++) addPlayer();

function startGame(){

const inputs=document.querySelectorAll('#playerSetup input');

game.players=[];

inputs.forEach(i=>{
if(i.value.trim()){
game.players.push(i.value.trim());
}
});

if(game.players.length<2){
alert('Add at least 2 players');
return;
}

game.totals={};
game.rounds=[];

game.players.forEach(p=>{
game.totals[p]=0;
});

buildRoundInputs();

document.getElementById('setupScreen').classList.add('hidden');
document.getElementById('gameScreen').classList.remove('hidden');

saveGame();
}

function buildRoundInputs(){

const holder=document.getElementById('scoreInputs');
holder.innerHTML='';

game.players.forEach(player=>{

const row=document.createElement('div');
row.className='player-row';

row.innerHTML=`
<label>${player}</label>
<input
type="number"
min="0"
max="80"
inputmode="numeric"
data-player="${player}"
placeholder="0-80">
`;

holder.appendChild(row);
});

document.getElementById(
    'roundLabel'
).innerHTML =
`
<div>🎴 Game In Progress</div>
<div>Round ${currentRound}</div>
`;
}
function saveRound(){
const btn =
    document.getElementById(
        "saveBtn"
    );

btn.disabled = true;
const round={};

let winnerFound=false;

document.querySelectorAll('#scoreInputs input').forEach(input=>{

const player=input.dataset.player;

const enteredValue =
    parseInt(input.value);

const score =
    isNaN(enteredValue)
        ? 0
        : Math.min(
            80,
            Math.max(
                0,
                enteredValue
            )
        );

round[player]=score;

game.totals[player]+=score;

if(game.totals[player]>=200){
winnerFound=true;
}

});

game.rounds.push(round);


saveGame();

if(winnerFound){

    btn.disabled = false;

    endGame();

    return;
}

currentRound++;

buildRoundInputs();

btn.disabled = false;
}

function endGame(){

localStorage.removeItem('flip7_current');

document.getElementById('gameScreen')
.classList.add('hidden');

document.getElementById('finalScreen')
.classList.remove('hidden');

const rankings=[...game.players]
.sort((a,b)=>game.totals[b]-game.totals[a]);

const winner=rankings[0];

document.getElementById('winnerBox').innerHTML=
`
<div class="card rank1">
<h2>🥇 ${winner}</h2>
<h3>${game.totals[winner]} points</h3>
</div>
`;

let board='<table>';

board+=`
<tr>
<th>Rank</th>
<th>Player</th>
<th>Score</th>
</tr>
`;

rankings.forEach((p,index)=>{

board+=`
<tr>
<td>${index+1}</td>
<td>${p}</td>
<td>${game.totals[p]}</td>
</tr>
`;

});

board+='</table>';

document.getElementById('leaderboard').innerHTML=board;

let hist='';

game.rounds.forEach((r,index)=>{

hist+=`<h3>Round ${index+1}</h3><ul>`;

Object.entries(r).forEach(([player,score])=>{
hist+=`<li>${player}: ${score}</li>`;
});

hist+='</ul>';
});

document.getElementById('history').innerHTML=hist;

runConfetti();
}

function saveGame(){

localStorage.setItem(
'flip7_current',
JSON.stringify({
game,
currentRound
})
);
}

function loadGame(){

const save=localStorage.getItem('flip7_current');

if(!save) return;

try{

const data=JSON.parse(save);

game=data.game;
currentRound=data.currentRound;

buildRoundInputs();

document.getElementById('setupScreen')
.classList.add('hidden');

document.getElementById('gameScreen')
.classList.remove('hidden');

}catch(e){}
}

function newGame(){

localStorage.removeItem('flip7_current');

location.reload();
}

function startVoice(){

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert('Speech recognition not supported');
return;
}

const recog=new SpeechRecognition();

recog.onresult=(event)=>{

const text=
event.results[0][0].transcript;

processVoice(text);
};

recog.start();
}

function processVoice(text){

const parts=text.split(',');

parts.forEach(chunk=>{

const words=chunk.trim().split(' ');

const score=parseInt(words[words.length-1]);

const player=
words.slice(0,-1).join(' ').trim();

if(isNaN(score)) return;

document
.querySelectorAll('#scoreInputs input')
.forEach(input=>{

if(
input.dataset.player.toLowerCase()
===
player.toLowerCase()
){
input.value=score;
}

});

});

alert('Voice scores entered');
}

function runConfetti(){

const canvas=document.getElementById('confetti');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const particles=[];

for(let i=0;i<200;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
vy:2+Math.random()*4,
size:4+Math.random()*6
});
}

let frame=0;

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

ctx.fillStyle=
`hsl(${Math.random()*360},100%,50%)`;

ctx.fillRect(
p.x,
p.y,
p.size,
p.size
);

p.y+=p.vy;

});

frame++;

if(frame<250){
requestAnimationFrame(animate);
}
}

animate();
}

loadGame();

</script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
}
</script>
</body>
</html>
